<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 262" role="img" aria-labelledby="title desc">
  <title id="title">Classic poker chip set</title>
  <desc id="desc">Seven poker chip denominations: 1, 5, 25, 100, 500, 1000 and 5000.</desc>
  <defs>
    <radialGradient id="f" cx="34%" cy="20%" r="74%">
      <stop offset="0" stop-color="#fff" stop-opacity=".4"/>
      <stop offset=".48" stop-color="#fff" stop-opacity=".05"/>
      <stop offset="1" stop-color="#000" stop-opacity=".22"/>
    </radialGradient>
    <!-- One disc, themed per instance through custom properties on each <use>. -->
    <g id="chip">
      <ellipse cx="60" cy="32" rx="45" ry="13.5" fill="var(--dark)"/>
      <path d="M15 18h90v14H15z" fill="var(--mid)"/>
      <ellipse cx="60" cy="18" rx="45" ry="13.5" fill="var(--top)"/>
      <g fill="var(--spot)">
        <ellipse cx="60" cy="7.2" rx="6" ry="2.1"/>
        <ellipse cx="60" cy="28.8" rx="6" ry="2.1"/>
        <ellipse cx="28" cy="12.2" rx="6" ry="2.1"/>
        <ellipse cx="92" cy="12.2" rx="6" ry="2.1"/>
        <ellipse cx="28" cy="23.8" rx="6" ry="2.1"/>
        <ellipse cx="92" cy="23.8" rx="6" ry="2.1"/>
      </g>
      <ellipse cx="60" cy="18" rx="29" ry="8.4" fill="var(--face)"/>
      <ellipse cx="60" cy="18" rx="29" ry="8.4" fill="url(#f)"/>
      <path d="M15 18a45 13.5 0 0 1 90 0v14a45 13.5 0 0 1-90 0z" fill="none" stroke="#04120c" stroke-opacity=".45" stroke-width="1.4"/>
      <path d="M15 18a45 13.5 0 0 0 90 0" fill="none" stroke="#04120c" stroke-opacity=".18" stroke-width="1"/>
    </g>
  </defs>

  <g>
    <use href="#chip" x="5" y="26" style="--dark:#b9c5ce;--mid:#d4dde4;--top:#f4f7f9;--spot:#2f4356;--face:#e6ecf1"/>
    <use href="#chip" x="135" y="26" style="--dark:#8c1430;--mid:#c5274f;--top:#ef3f6d;--spot:#f7e7e9;--face:#9e1a3a"/>
    <use href="#chip" x="265" y="26" style="--dark:#08654c;--mid:#0c916d;--top:#19b785;--spot:#e7fff7;--face:#08785a"/>
    <use href="#chip" x="395" y="26" style="--dark:#151a20;--mid:#292f37;--top:#515b68;--spot:#f0d168;--face:#20262d"/>
    <use href="#chip" x="5" y="150" style="--dark:#4e237a;--mid:#7241a6;--top:#9561ca;--spot:#f3eaff;--face:#5e318b"/>
    <use href="#chip" x="135" y="150" style="--dark:#9a7413;--mid:#c99a1f;--top:#f0c245;--spot:#4a3405;--face:#e2ae2c"/>
    <use href="#chip" x="265" y="150" style="--dark:#0f4e82;--mid:#176cae;--top:#319be4;--spot:#e8f5ff;--face:#105f9c"/>
  </g>

  <!-- Face values, as they appear on the felt. -->
  <g font-family="Inter,Arial,sans-serif" font-size="13" font-weight="800" text-anchor="middle">
    <text x="65" y="48.6" fill="#22303c">1</text>
    <text x="195" y="48.6" fill="#fff">5</text>
    <text x="325" y="48.6" fill="#fff">25</text>
    <text x="455" y="48.6" fill="#fff">100</text>
    <text x="65" y="172.6" fill="#fff">500</text>
    <text x="195" y="172.6" fill="#3a2703" font-size="11.5">1000</text>
    <text x="325" y="172.6" fill="#fff" font-size="11.5">5000</text>
  </g>

  <!-- Captions: the face text alone is unreadable at preview scale. -->
  <g fill="#dceae6" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700" text-anchor="middle">
    <text x="65" y="105">1</text><text x="195" y="105">5</text>
    <text x="325" y="105">25</text><text x="455" y="105">100</text>
    <text x="65" y="229">500</text><text x="195" y="229">1000</text>
    <text x="325" y="229">5000</text>
  </g>
</svg>
